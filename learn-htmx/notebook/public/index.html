<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>notebook</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/vendor/htmx.min.js"></script>
  </head>
  <body
    class="mx-auto flex max-w-2xl flex-col gap-6 bg-neutral-950 p-8 text-neutral-100"
  >
    <header class="flex flex-col gap-1">
      <h1 class="text-3xl font-semibold">notebook</h1>
      <p class="text-sm text-neutral-400">
        htmx 4 playground &middot; the server returns HTML fragments, not JSON
      </p>
    </header>

    <section
      class="flex flex-col gap-3 rounded-lg border border-neutral-800 p-4"
    >
      <h2 class="font-medium">GET &rarr; swap a fragment</h2>
      <div class="flex items-center gap-3">
        <button
          class="rounded bg-neutral-100 px-3 py-1.5 text-sm font-medium text-neutral-900 hover:bg-white"
          hx-get="/fragments/hello"
          hx-target="#hello"
          hx-indicator="#hello-indicator"
        >
          Say hello
        </button>
        <span
          id="hello-indicator"
          class="htmx-indicator text-sm text-neutral-500"
        >
          loading&hellip;
        </span>
      </div>
      <div id="hello" class="text-sm text-neutral-500">nothing yet</div>
    </section>

    <section
      class="flex flex-col gap-3 rounded-lg border border-neutral-800 p-4"
    >
      <h2 class="font-medium">POST a form &rarr; 422 validation</h2>
      <form
        class="flex items-center gap-3"
        hx-post="/fragments/greet"
        hx-target="#greet"
      >
        <input
          class="rounded border border-neutral-700 bg-neutral-900 px-3 py-1.5 text-sm"
          type="text"
          name="name"
          placeholder="your name"
        />
        <button
          class="rounded bg-neutral-100 px-3 py-1.5 text-sm font-medium text-neutral-900 hover:bg-white"
          type="submit"
        >
          Greet
        </button>
      </form>
      <div id="greet" class="text-sm text-neutral-500">
        submit an empty name to see the 422 path
      </div>
    </section>
  </body>
</html>
